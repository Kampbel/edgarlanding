<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada (404) | Edgar Santos</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #0a0a0c;
      color: #f5f3ef;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(43, 92, 255, 0.15) 0%, rgba(10, 10, 12, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 560px;
      padding: 3.5rem 2.5rem;
      background: rgba(18, 22, 36, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
    }
    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 1.5rem;
    }
    .error-code {
      font-size: 5.5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #3b82f6 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      letter-spacing: -2px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      color: rgba(245, 243, 239, 0.65);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #2b5cff;
      color: #ffffff;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px -5px rgba(43, 92, 255, 0.4);
    }
    .btn:hover {
      background: #3e6eff;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(43, 92, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card">
    <img src="/favicon.png" alt="Edgar Santos Logo" class="logo-img">
    <div class="error-code">404</div>
    <h1>Página no encontrada</h1>
    <p>El enlace al que intentas acceder no existe, ha sido movido o la dirección URL es incorrecta.</p>
    <a href="/" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Volver al Portafolio
    </a>
  </div>
</body>
</html>
